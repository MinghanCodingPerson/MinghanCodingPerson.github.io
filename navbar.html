<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Navigation</title>
    <link rel="stylesheet" href="index.css">
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
        }
        #index_container {
            width: 100vw;
            height: 100vh;
        }
        #menu_bar {
            height: 10vh;
            width: 100vw;
            position: absolute;
            top: 50%;
            left: 0;
            transform: translate(0, -50%);
            background-color: rgba(214, 214, 214, 0.75);
            display: flex;
            flex-wrap: nowrap;
        }
        .menu_box {
            justify-content: center;
            align-items: center;
            font-size: 2rem;
            font-family: fantasy;
            height: 10vh;
            color: black;
        }
        .menu_box:hover {
            font-size: 3rem;
            background-color: rgba(214, 214, 214, 1);
        }
        a {
            text-decoration: underline;
            text-decoration-color: transparent;
        } /*Removes the underline created by links*/
        .containers {
            height: 10vh;
            width: 20vw;
            flex-basis: 20vw;
        }
        #container4 {
            height: 10vh;
            width: 10vw;
            flex-basis: 10vw;
        }
        #title_box {
            height: 10vh;
            width: 30vw;
            display: flex;
            flex-basis: 30vw;
            font-size: 3rem;
            justify-content: center;
            align-items: center;
            font-family: fantasy;
        }
        #about_box {
            width: 20vw;
            display: flex;
            flex-basis: 20vw;
        }
        #store_box {
            width: 20vw;
            display: flex;
            flex-basis: 20vw;
        }
        #printer_box {
            width: 20vw;
            display: flex;
            flex-basis: 20vw;
        }
        #back_box {
            width: 10vw;
            display: flex;
            flex-basis: 10vw;
        }
        #background_sticker1 {
            position: absolute;
            top: 70%;
            left: 80%;
            transform: rotate(25deg);
        }
        #background_sticker2 {
            position: absolute;
            top: 40%;
            left: 5%;
            transform: rotate(-15deg);
            transform: scale(0.5);
        }
        #background_sticker3 {
            position : absolute;
            top: -5%;
            left: -4%;
            transform: scale(0.25);
            z-index: 2;
        }
        #background_sticker4 {
            position: absolute;
            top: 2.5%;
            left: -5%;
            transform: scale(0.25);
            z-index: 1;
            rotate: 15deg;
        }
    </style>
</head>
<body>
    <div id="index_container">
        <image id="background_sticker1" class="background_stickers" src="y2k_one.png"></image>
        <image id="background_sticker2" class="background_stickers" src="sanrio_one.jpg"></image>
        <image id="background_sticker3" class="background_stickers" src="jdm_one.jpg"></image>
        <image id="background_sticker4" class="background_stickers" src="jdm_two.png"></image>
        <image id="background_sticker5" class="background_stickers" src=""></image>
        <image id="background_sticker6" class="background_stickers" src=""></image>
        <image id="background_sticker7" class="background_stickers" src=""></image>
        <image id="background_sticker8" class="background_stickers" src=""></image>
        <image id="background_sticker9" class="background_stickers" src=""></image>
        <image id="background_sticker10" class="background_stickers" src=""></image>
        <image id="background_sticker11" class="background_stickers" src=""></image>
        <image id="background_sticker12" class="background_stickers" src=""></image>
        <image id="background_sticker13" class="background_stickers" src=""></image>
        <image id="background_sticker14" class="background_stickers" src=""></image>
        <image id="background_sticker15" class="background_stickers" src=""></image>
        <div id="menu_bar">
            <div id="title_box">
                Sticker Printer
            </div>
            <div id="container1" class="containers">
                <a href="about.html">
                    <div id="about_box" class="menu_box">
                        About Us
                    </div>
                </a>
            </div>
            <div id="container2" class="containers">
                <a href="store2.html">
                    <div id="store_box" class="menu_box">
                        Our Store
                    </div>
                </a>
            </div>
            <div id="container3" class="containers">
                <a href="printer.html">
                    <div id="printer_box" class="menu_box">
                        Our Printer
                    </div>
                </a>
            </div>
            <div id="container4">
                <a href="back_index.html">
                    <div id="back_box" class="menu_box">
                        Back
                    </div>
                </a>
            </div>
        </div>
    </div>
</body>
</html>
