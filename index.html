<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sticker Shop Title</title>
    <style>
        body {
            min-width: 100vw;
            min-height: 100vh;
            background-image: url(https://c4.wallpaperflare.com/wallpaper/825/815/706/hoonigan-ken-block-collage-artwork-sticker-bomb-hd-wallpaper-preview.jpg);
            background-repeat: norepeat;                    /* Ensures img doesn't repeat as user scrolls */
            background-position: center;                    /* Centers img */
            background-size: cover;                         /* Scales img to cover screen */
            background-attachment: fixed;                   /* Keeps the background fixed while user scrolls */
            overflow-x: hidden;                             /* Hides the x-axis or horizontal scrollbar */
            overflow-y: scroll;                             /* Keeps the y-axis or vertical scrollbar */
        }
        #title_box {
            width: 50vw;
            height: 50vh;
            background-color: rgba(255, 255, 255, 0.75);
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -75%);
            font-size: 3rem;
            text-align: center;
            font-family:'Trebuchet MS', 'Lucida Sans Unicode', 'Lucida Grande', 'Lucida Sans', Arial, sans-serif;
            border-radius: 20px;
        }
        #delve_button {
            background-color: rgba(255, 255, 255, 0.75);
            display: flex;
            height: 50px;
            width: 300px;
            font-size: 0.75rem;
            align-items: center;
            position: absolute;
            top: 70%;
            left: 50%;
            transform: translate(-50%, -50%);
        }
        #delve_button:hover {
            background-color: rgba(255, 255, 255, 0.75);
            font-size: 1rem;
            height: 75px;
            width: 350px;
        }
        .header {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
        }
    </style>
</head>
<body>
    <div id="title_box">
        <h1> The Sticker Printer </h1>
    </div>
    <div id="delve_button" link rel="https://www.google.com">
        <div class="header">
            <h3> Delve Deep Into Our Store </h3>
        </div>
    </div>
    <div id="print_button">
        <button><h3> Print Your Own Stickers </h3></button>
    </div>
</body>
</html>
