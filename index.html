<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sticker Printer</title>
    <style>
        #main_container {
            height: 20vh;
            width: 50vw;
            position: absolute;
            top: 50%;
            left: 0;
            transform: translate(0, -50%);
        }
        #title_screen {
            height: 20vh;
            width: 50vw;
            background-color: rgba(214, 214, 214, 0.75);
            font-family: fantasy;
            position: absolute;
            top: 0;
            left: 0;
            color: black;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 5rem;

        }
        a {
            text-decoration: underline;
            text-decoration-color: transparent;
        } /*Removes the underline created by links*/
    </style>
</head>
<body>
    <div id="main_container">
        <a href="navbar.html">
            <div id="title_screen">
                Sticker Printer
            </div>
        </a>
    </div>
</body>
</html>
