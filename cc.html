<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body {
            background-color: lightskyblue;
            margin: 0;
            padding: 0;
        }
        #container_transparent {
            position: relative;
            width: 100vw;
            height: 100vh;
        }
        .cards {
            position: absolute;
            width: 30rem;
            height: 15rem;
            border-radius: 2rem;
            opacity: 0;
            animation-name: appear;
            animation-delay: 0.25s;
            animation-fill-mode: forwards;
            animation-duration: 0.5s;
        }
        .cards_text {
            position: absolute;
            top: 0;
            left: 5%;
            font-size: 2rem;
            font-weight: bold;
            font-family: monospace;
            color: white;
        }
        #visa {
            background-color: purple;
            top: 30%;
            left: 15%;
            transform: rotate(-30deg);
        }
        #mastercard {
            background-color:blueviolet;
            top: 30%;
            left: 35%;
            transform: rotate(-30deg);
        }
        #american_express {
            background-color: blue;
            top: 30%;
            left: 55%;
            transform: rotate(-30deg);
        }
        #discover {
            background-color: darkblue;
            top: 30%;
            left: 55%;
            transform: rotate(-30deg);
        }
        .cards:hover {
            width: 35rem;
            height: 17.5rem;
        }
        #home_button2 {
            height: 20px;
            width: 20px;
            position: absolute;
            top: 100%;
            left: 100%;
            transform: translate(-150%, -100%);
        }
        #images {
            height: 20px;
            width: 20px;
        }
    </style>
</head>
<body>
    <div id="container_transparent">
        <a href="visa.html">
            <div id="visa" class="cards">
                <p id="v_text" class="cards_text">Credit Card</p>
            </div>
        </a>
        <a href="mastercard.html">
            <div id="mastercard" class="cards">
                <p id="m_text" class="cards_text">Debit Card</p>
            </div>
        </a>
        <a href="american_express.html">
            <div id="american_express" class="cards">
                <p id="ae_text" class="cards_text">Reward Points</p>
            </div>
        </a>
        <a href="discover.html">
            <div id="discover" class="cards">
                <p id="d_text" class="cards_text">Discover</p>
            </div>
        </a>
        <a href="index.html">
            <div id="home_button2">
                <img src="house_button.png" id="image">
            </div>
        </a>
    </div>
</body>
</html>
