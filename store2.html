<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body {
            min-width: 100vw;
            min-height: 100vh;
            background-image: url(https://c4.wallpaperflare.com/wallpaper/825/815/706/hoonigan-ken-block-collage-artwork-sticker-bomb-hd-wallpaper-preview.jpg);
            background-repeat: norepeat;                    /* Ensures img doesn't repeat as user scrolls */
            background-position: center;                    /* Centers img */
            background-size: cover;                         /* Scales img to cover screen */
            background-attachment: fixed;                   /* Keeps the background fixed while user scrolls */
            overflow: hidden;
        }
        .nav_offset {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            background-color: indigo;
            font-family: sans-serif;
            font-size: 1rem;
            display: flex;
            flex-direction: row-reverse;
            align-items: center;
            padding: 1rem;
        }
        .home_button_navbar {
            color: #ebebeb;
            text-decoration: none;
        }
        .home_button_navbar {
            margin-right: auto; 
        }
        #store_container {
            background-color: rgba(255, 255, 255, 0.75);
            position: absolute;
            display: flex;
            flex-direction: row;
            flex: 1;
            flex-wrap: wrap;
            top: 20%;
            left: 10%;
            width: 50rem;
            height: 20rem;
            padding: 2rem;
        }
        .linked_containers {
            position: relative;
            display: flex;
            flex-direction: column;
            flex: 1;
            width: 3rem;
            height: 4.5rem;
        }
        .image {
            background-color: blue;
            width: 6rem;
            height: 6rem;
        }
        .desc {
            background-color: green;
            width: 6rem;
            height: 4rem;
        }
    </style>
</head>
<body>
    <div id="store_container">
        <a href="#" class="linked_containers" id="vocaloid_stickers">
            <div id="vocaloid_image" class="image">

            </div>
            <div id="vocaloids_desc" class="desc">

            </div>
        </a>
        <a href="#" class="linked_containers" id="car_stickers">
            <div id="car_image" class="image">

            </div>
            <div id="cars_desc" class="desc">
                
            </div>
        </a>
        <a href="#" class="linked_containers" id="food_stickers">
            <div id="food_image" class="image">

            </div>
            <div id="food_desc" class="desc">
                
            </div>
        </a>
        <a href="#" class="linked_containers" id="emoji_stickers">
            <div id="emoji_image" class="image">

            </div>
            <div id="emoji_desc" class="desc">
                
            </div>
        </a>
    </div>
    <div id="navbar" class="nav_offset">
        <a href="index.html" class="home_button_navbar">Home</a>
    </div>
</body>
</html>
